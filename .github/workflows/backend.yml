
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Test Django Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fleet_test
          POSTGRES_USER: fleet_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet_user -d fleet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: "temporary-ci-secret-key"
      DEBUG: "False"
      POSTGRES_DB: fleet_test
      POSTGRES_USER: fleet_user
      POSTGRES_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Przygotuj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Zainstaluj zaleznosci
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sprawdz konfiguracje Django
        run: python manage.py check

      - name: Sprawdz migracje
        run: python manage.py makemigrations --check --dry-run

      - name: Wykonaj migracje
        run: python manage.py migrate --noinput

      - name: Uruchom testy Django
        run: python manage.py test
