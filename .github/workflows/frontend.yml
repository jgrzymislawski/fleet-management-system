
name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Build React Application
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v5

      - name: Zainstaluj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Zainstaluj zaleznosci
        run: npm ci

      - name: Zbuduj frontend
        run: npm run build
